<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wealth</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF6EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080C22" />
    <script>
      /* The root follows the system. Nothing chooses light or dark by hand. */
      try {
        document.documentElement.dataset.ground = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.ground = "light";
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="One picture of everything you own — brokerage, crypto, and cash."
    />
    <link rel="preload" href="/wh/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/wh/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/wh/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
